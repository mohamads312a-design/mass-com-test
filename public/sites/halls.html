<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Layali Venues</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#faf7f2;color:#2b2520;-webkit-tap-highlight-color:rgba(0,0,0,.05)}
a{color:inherit;text-decoration:none}img{display:block;width:100%}button{font-family:inherit}
.serif{font-family:"Playfair Display",Amiri,Georgia,serif}
header{position:sticky;top:0;z-index:30;background:#1f1a15;color:#e9d8b4;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.logo{font-size:21px;letter-spacing:2px}.hero{position:relative}.hero img{height:300px;object-fit:cover;filter:brightness(.6)}
.hero div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;padding:20px}.hero h1{font-size:30px;margin:0 0 8px;line-height:1.25}
.wrap{padding:16px 14px 120px}.h{font-size:24px;margin:18px 0 12px;text-align:center}
.hall{background:#fff;border-radius:4px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.hall img{height:170px;object-fit:cover}.hall .in{padding:14px}.hall h3{margin:0 0 6px;font-size:22px}
.hall p{margin:0 0 12px;color:#6b6258;font-size:14px;line-height:1.6;font-style:italic}
.btn{display:inline-block;border:1px solid #b08d4c;color:#8a6a2f;padding:9px 20px;font-size:13px;letter-spacing:2px;text-transform:uppercase;background:none}
.btn.f{background:#b08d4c;color:#fff;display:block;width:100%;text-align:center;padding:14px;border:0;font-size:15px;margin-top:10px}
.tabs{display:flex;border-bottom:1px solid #ddd3c4;background:#fff;position:sticky;top:48px;z-index:20}.tabs a{flex:1;text-align:center;padding:12px 0;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#8b8177}.tabs a.on{color:#2b2520;border-bottom:2px solid #b08d4c;font-weight:700}
.pane{background:#fff;padding:16px;margin-top:12px;font-size:15px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:10px 4px;border-bottom:1px solid #eee5d8}td:last-child{text-align:end;font-weight:700}
.note{font-size:11px;color:#9a8f83;margin-top:10px;line-height:1.5}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:6px}.gal img{height:120px;object-fit:cover}
.ov{position:fixed;inset:0;z-index:100;background:rgba(20,15,10,.7);display:flex;align-items:center;justify-content:center;padding:18px}
.mod{background:#fff;padding:22px 18px;width:100%;max-width:380px;text-align:center}.mod h3{margin:0 0 6px;font-size:22px}.mod p{margin:0 0 10px;color:#6b6258;font-size:14px;line-height:1.5}
.mod input{width:100%;padding:12px;border:1px solid #cfc4b3;font-size:16px;margin-top:8px;font-family:inherit}
.tl{background:none;border:0;color:#a59a8d;font-size:11px;text-decoration:underline;margin-top:12px}
.chat{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .4s}
@keyframes up{from{transform:translateY(100%)}}
.chat .x{position:absolute;top:10px;inset-inline-end:14px;font-size:16px;color:#aaa}.chat .b{background:#f3ede3;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;margin:8px 0;max-width:85%}
.chat .in{border:1px solid #cfc4b3;border-radius:99px;padding:11px 14px;color:#aaa;font-size:14px;margin-top:8px}
.foot{background:#1f1a15;color:#8f8474;text-align:center;font-size:12px;padding:22px 14px 100px;line-height:1.8}.foot .sim{color:#e9d8b4}
</style></head>
<body data-site="halls">
<header><span data-t="menu">☰</span><a class="logo serif" href="#/" data-t="logo">LAYALI</a><span data-t="phone">☏</span></header>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<script src="/js/content.js"></script>
<script src="/js/lab.js"></script>
<script>
(function(){
const C = CONTENT, ar = Lab.lang === 'ar', tx = (a, e) => ar ? a : e, $ = (s) => document.querySelector(s);
const N = (n) => n.toLocaleString('en-US');
window.MISSION = { check: {}, task: {
  q: { ar: 'بتنظّم عشا رسمي (ترابيزات مدوّرة) لـ 200 ضيف يوم جمعة بالليل. أنهي قاعة تكفّي وإيجارها كام؟', en: 'You’re planning a seated gala dinner (round tables) for 200 guests on a Friday evening. Which hall fits, and what is its rate?' },
  choices: { ar: ['قاعة اللوتس · 45,000 جنيه', 'قاعة البردي · 60,000 جنيه', 'قاعة البردي · 48,000 جنيه', 'قاعة أبو الهول · 95,000 جنيه'], en: ['Lotus Hall · 45,000 EGP', 'Papyrus Hall · 60,000 EGP', 'Papyrus Hall · 48,000 EGP', 'Sphinx Ballroom · 95,000 EGP'] }, correct: 1 } };
const H = {
  lotus: { n: tx('قاعة اللوتس', 'Lotus Hall'), img: ['culture', 5], f: tx('جوهرة دافية بيغمرها النور، بتحضن أجمل لحظاتكم في أجواء من الأناقة الهادية.', 'An intimate jewel bathed in light, embracing your finest moments in quiet elegance.'), sp: [260, 4.2, 200, 90, 120, 220], r: [28000, 36000, 34000, 45000] },
  papyrus: { n: tx('قاعة البردي', 'Papyrus Hall'), img: ['local', 8], f: tx('مساحة بتحكي حكايات، كل ركن فيها بيهمس بالفخامة والأصالة.', 'A space that tells stories, where every corner whispers of grandeur and heritage.'), sp: [420, 5.5, 350, 160, 200, 400], r: [38000, 48000, 46000, 60000] },
  sphinx: { n: tx('قاعة أبو الهول', 'Sphinx Ballroom'), img: ['celeb', 3], f: tx('تحفة معمارية بتخطف الأنفاس، اتصممت للمناسبات اللي بتتحفر في الذاكرة.', 'A breathtaking architectural masterpiece, made for occasions etched in memory.'), sp: [700, 7, 600, 280, 320, 650], r: [60000, 78000, 74000, 95000] },
};
$('#foot').innerHTML = `LAYALI VENUES · ${tx('القاهرة الجديدة', 'New Cairo')}<br>${tx('عن ليالي · الوظائف · تواصل معنا', 'About · Careers · Contact')}<br><span class="sim">${tx('محاكاة تعليمية — القاعات والأسعار من خيالنا', 'Classroom simulation — venues and prices are fictional')}</span>`;
let gated = false, chats = 0;

function home() {
  $('#app').innerHTML = `<div class="hero"><img src="${C.thumb('culture', 9)}"><div><h1 class="serif">${tx('حيث تتحول اللحظات إلى ذكريات', 'Where moments become memories')}</h1><span class="btn" style="color:#fff;border-color:#fff" data-t="hero-cta">${tx('اكتشف', 'Discover')}</span></div></div>
    <div class="wrap"><div class="h serif">${tx('مساحاتنا', 'Our spaces')}</div>
    ${Object.entries(H).map(([k, h]) => `<div class="hall"><img src="${C.thumb(h.img[0], h.img[1])}"><div class="in"><h3 class="serif">${h.n}</h3><p>${h.f}</p><a class="btn" href="#/h/${k}/overview" data-t="hall">${tx('اكتشف', 'Discover')}</a></div></div>`).join('')}</div>`;
  scrollTo(0, 0); Lab.setView({ view: 'home', kind: 'home' }); chat(7000);
}
function hall(k, tab) {
  const h = H[k]; if (!h) return home();
  if (tab === 'rates' && !gated) return gate(() => hall(k, 'rates'));
  const T = [['overview', tx('نظرة عامة', 'Overview')], ['gallery', tx('صور', 'Gallery')], ['specs', tx('مواصفات', 'Specs')], ['rates', tx('أسعار', 'Rates')]];
  const sp = [[tx('المساحة', 'Floor area'), h.sp[0] + ' m²'], [tx('ارتفاع السقف', 'Ceiling height'), h.sp[1] + ' m'], [tx('مسرح (كراسي صفوف)', 'Theatre (rows of chairs)'), h.sp[2]], [tx('فصل دراسي', 'Classroom'), h.sp[3]], [tx('بانكويت (ترابيزات مدوّرة)', 'Banquet (round tables)'), h.sp[4]], [tx('كوكتيل (وقوف)', 'Cocktail (standing)'), h.sp[5]]];
  const rt = [[tx('الأحد–الخميس · نهار', 'Sun–Thu · Day'), h.r[0]], [tx('الأحد–الخميس · مساء', 'Sun–Thu · Evening'), h.r[1]], [tx('الجمعة–السبت · نهار', 'Fri–Sat · Day'), h.r[2]], [tx('الجمعة–السبت · مساء', 'Fri–Sat · Evening'), h.r[3]]];
  const body = { overview: `<p style="margin:0;font-style:italic">${h.f}</p><p>${tx('من أول ما تدخل، هتحس إن كل تفصيلة اتعملت بحب. إضاءة بتتغير مع مزاج المناسبة، وفريق بيهتم بكل طلب، وتجربة ضيافة مالهاش زي.', 'From the moment you enter, you feel every detail was made with love. Lighting that follows the mood of your occasion, a team that cares for every request, and hospitality like no other.')}</p><a class="btn f" href="#/h/${k}/rates" data-t="quote">${tx('اطلب عرض سعر', 'Request a quote')}</a>`,
    gallery: `<div class="gal">${[1, 2, 3, 4].map(i => `<img src="${C.thumb(h.img[0], h.img[1] + i * 3)}">`).join('')}</div>`,
    specs: `<table>${sp.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><div class="note">${tx('الطاقة الاستيعابية بعدد الأفراد.', 'Capacities are in number of guests.')}</div>`,
    rates: `<table>${rt.map(([a, b]) => `<tr><td>${a}</td><td>${N(b)} ${tx('جنيه', 'EGP')}</td></tr>`).join('')}</table><div class="note">${tx('الأسعار لإيجار القاعة فقط ولا تشمل 14% ضريبة و12% خدمة.', 'Rates are for hall hire only and exclude 14% VAT and 12% service.')}</div>` }[tab] || '';
  $('#app').innerHTML = `<div class="hero"><img src="${C.thumb(h.img[0], h.img[1])}" style="height:180px"><div><h1 class="serif">${h.n}</h1></div></div>
    <div class="tabs">${T.map(([t, l]) => `<a class="${t === tab ? 'on' : ''}" href="#/h/${k}/${t}" data-t="tab-${t}">${l}</a>`).join('')}</div><div class="wrap" style="padding-top:0"><div class="pane" id="pane">${body}</div>
    <a class="btn" href="#/" data-t="back" style="margin-top:14px">‹ ${tx('كل القاعات', 'All spaces')}</a></div>`;
  scrollTo(0, 0); Lab.setView({ view: 'hall-' + tab, kind: 'hall', id: k + ':' + tab }); chat(9000);
}
function gate(after) {
  const t0 = Date.now(); const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="mod"><h3 class="serif">${tx('احصل على عرض سعر خاص بيك', 'Get your personalised quote')}</h3><p>${tx('سيب بياناتك وفريقنا هيكلمك في خلال 48 ساعة.', 'Leave your details and our team will call you within 48 hours.')}</p>
    <input placeholder="${tx('الاسم', 'Name')}" data-t="gate-input"><input placeholder="${tx('الموبايل', 'Mobile')}" data-t="gate-input"><input placeholder="${tx('تاريخ المناسبة', 'Event date')}" data-t="gate-input">
    <button class="btn f" data-t="gate-send" id="gs">${tx('ابعت الطلب', 'Send request')}</button><button class="tl" data-t="gate-skip" id="gk">${tx('عرض الأسعار القياسية', 'view standard rates')}</button></div>`;
  document.body.appendChild(o);
  const close = (action) => { gated = true; Lab.log('gate', { action, ms: Date.now() - t0 }); o.remove(); after(); };
  o.querySelector('#gs').onclick = () => { Lab.toast(tx('شكرًا! هنكلمك قريب', 'Thank you! We’ll be in touch')); close('send'); };
  o.querySelector('#gk').onclick = () => close('skip');
}
let chatT = null;
function chat(delay) {
  clearTimeout(chatT); if (Lab.dashboard || chats >= 2) return;
  chatT = setTimeout(() => { if (document.querySelector('.chat,.ov')) return; chats++; const t0 = Date.now(); const c = document.createElement('div'); c.className = 'chat';
    c.innerHTML = `<span class="x" data-t="chat-close">✕</span><b>💬 ${tx('نور من ليالي', 'Nour from Layali')}</b><div class="b">${tx('أهلًا! 👋 بتخطط لمناسبة؟ احكيلي عنها وأنا أساعدك.', 'Hi there! 👋 Planning an event? Tell me about it and I’ll help.')}</div><div class="in" data-t="chat-input">${tx('اكتب رسالتك…', 'Type your message…')}</div>`;
    document.body.appendChild(c); Lab.log('adseen', { id: 'halls-chat' });
    c.querySelector('.x').onclick = () => { Lab.log('chat', { action: 'close', ms: Date.now() - t0 }); c.remove(); };
    c.querySelector('.in').onclick = () => Lab.toast(tx('كل موظفينا مشغولين دلوقتي', 'All our agents are busy right now')); }, delay);
}
function route() { const m = location.hash.match(/^#\/h\/(\w+)\/(\w+)/); if (m) hall(m[1], m[2]); else home(); }
addEventListener('hashchange', route); route();
})();
</script>
</body></html>
