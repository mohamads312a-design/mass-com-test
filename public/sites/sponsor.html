<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Partner with Cairo Creators Summit</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0d0820;color:#ece8f7;-webkit-tap-highlight-color:rgba(255,255,255,.08)}
a{color:inherit;text-decoration:none}button{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:#0d0820;border-bottom:1px solid #2a2146;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.logo{font-weight:900;font-size:18px;letter-spacing:1px}.logo small{display:block;font-weight:500;font-size:10px;letter-spacing:3px;color:#d9b45a}
.hero{padding:56px 22px 46px;text-align:center;background:radial-gradient(circle at 50% 0,#5b21b6,#0d0820 70%)}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 12px;font-weight:900}.hero p{margin:0 0 20px;color:#c9c0e6;font-size:15px;line-height:1.6}
.gold{color:#d9b45a}.wrap{padding:18px 14px 120px}.h{font-size:22px;font-weight:900;margin:26px 0 12px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats div{background:#171032;border-radius:14px;padding:16px 6px;font-size:11px;color:#a79fc6}.stats b{display:block;font-size:22px;color:#d9b45a;margin-bottom:4px}
.why{background:#171032;border-radius:14px;padding:16px;margin-bottom:10px;font-size:14px;line-height:1.6;color:#c9c0e6}.why b{display:block;color:#fff;font-size:16px;margin-bottom:4px}
.pk{background:linear-gradient(160deg,#1c1340,#120b2b);border:1px solid #3a2d66;border-radius:16px;padding:18px;margin-bottom:14px}.pk h3{margin:0 0 4px;font-size:22px}.pk i{color:#d9b45a;font-size:13px}
.pk p{margin:10px 0 14px;color:#b9b0d8;font-size:14px;line-height:1.6}
.btn{display:inline-block;border:1px solid #d9b45a;color:#d9b45a;padding:10px 20px;font-size:12px;letter-spacing:2px;text-transform:uppercase;background:none;border-radius:99px}
.btn.f{background:#d9b45a;color:#1b1230;display:block;width:100%;text-align:center;padding:14px;border:0;font-size:14px;font-weight:800;margin-top:12px}
.tabs{display:flex;border-bottom:1px solid #2a2146;background:#0d0820;position:sticky;top:53px;z-index:20}.tabs a{flex:1;text-align:center;padding:13px 0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a80ad}.tabs a.on{color:#fff;border-bottom:2px solid #d9b45a;font-weight:700}
.pane{background:#171032;border-radius:14px;padding:16px;margin-top:14px;font-size:15px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:11px 4px;border-bottom:1px solid #2a2146}td:last-child{text-align:end;font-weight:700;color:#d9b45a}
.note{font-size:10px;color:#7d74a0;margin-top:10px;line-height:1.5}
.ov{position:fixed;inset:0;z-index:100;background:rgba(5,2,15,.8);display:flex;align-items:center;justify-content:center;padding:18px}
.mod{background:#fff;color:#1b1230;border-radius:16px;padding:22px 18px;width:100%;max-width:380px;text-align:center}.mod h3{margin:0 0 6px;font-size:21px}.mod p{margin:0 0 10px;color:#5d5675;font-size:14px;line-height:1.5}
.mod input{width:100%;padding:12px;border:1px solid #cfc8e2;border-radius:8px;font-size:16px;margin-top:8px;font-family:inherit}
.tl{background:none;border:0;color:#a59dbd;font-size:11px;text-decoration:underline;margin-top:12px}
.chat{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;color:#1b1230;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .4s}
@keyframes up{from{transform:translateY(100%)}}
.chat .x{position:absolute;top:10px;inset-inline-end:14px;font-size:16px;color:#aaa}.chat .b{background:#f1edf9;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;margin:8px 0;max-width:85%}
.chat .in{border:1px solid #cfc8e2;border-radius:99px;padding:11px 14px;color:#aaa;font-size:14px;margin-top:8px}
.pdfbar{background:#2b2b2b;color:#ddd;font-size:12px;padding:9px 12px;display:flex;justify-content:space-between;position:sticky;top:53px;z-index:20}
.pdf{background:#525659;padding:12px 28px 120px}.pg{background:#fff;color:#222;aspect-ratio:16/9;margin-bottom:10px;padding:5% 6%;font-size:5.2px;line-height:1.5;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4);direction:ltr;text-align:left}
.pg.z{margin-inline:-22px;font-size:8px}.pg h4{font-size:2.2em;margin:0 0 .5em;color:#3b1d8f}.pg table{font-size:1em}.pg td,.pg th{padding:.35em .4em;border-bottom:.5px solid #ddd;color:#222;font-weight:400;text-align:center}.pg td:first-child,.pg th:first-child{text-align:left}.pg td:last-child{color:#222;font-weight:400;text-align:center}.pg th{font-weight:700;color:#3b1d8f}
.pg.cv{background:linear-gradient(135deg,#3b1d8f,#0d0820);color:#fff;display:flex;flex-direction:column;justify-content:center}.pg.cv h4{color:#d9b45a;font-size:3em}
.load{padding:120px 20px;text-align:center;color:#c9c0e6}.spin{width:38px;height:38px;border:4px solid #3a2d66;border-top-color:#d9b45a;border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.foot{background:#080414;color:#6f678f;text-align:center;font-size:12px;padding:22px 14px 100px;line-height:1.8}.foot .sim{color:#d9b45a}
</style></head>
<body data-site="sponsor">
<header><a class="logo" href="#/" data-t="logo">SAHRA EVENTS<small>PARTNERSHIPS</small></a><span data-t="menu">☰</span></header>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<script src="/js/content.js"></script>
<script src="/js/lab.js"></script>
<script>
(function(){
const ar = Lab.lang === 'ar', tx = (a, e) => ar ? a : e, $ = (s) => document.querySelector(s);
const N = (n) => n.toLocaleString('en-US'), EGP = tx('جنيه', 'EGP');
// The student plays the sponsor. Every fact exists, but it is buried under vague wording.
window.MISSION = { check: {}, task: {
  q: { ar: 'إنت مدير تسويق ومعاك 150,000 جنيه. محتاج اللوجو بتاعك على المسرح الرئيسي + بوث في الإيفنت. هتشتري إيه؟', en: 'You’re a brand manager with 150,000 EGP. You need your logo on the main stage and a booth at the event. What do you buy?' },
  choices: { ar: ['باقة بلاتينيوم', 'باقة جولد', 'باقة جولد + إضافة البوث', 'مش واضح. هرعى إيفنت تاني'], en: ['Platinum package', 'Gold package', 'Gold package + booth add-on', 'I can’t tell. I’d sponsor another event'] }, correct: 2 } };
const P = {
  plat: { n: tx('شريك بلاتيني', 'Platinum Partner'), s: tx('أقوى حضور ممكن', 'The ultimate statement'), f: tx('شراكة استراتيجية شاملة بتحط علامتك في قلب التجربة وبتخلق تأثير ما يتنسيش.', 'A holistic strategic partnership that places your brand at the heart of the experience and creates unforgettable impact.'), price: 250000,
    b: [[tx('ظهور العلامة', 'Brand visibility'), 'Tier-1'], [tx('مساحة تفعيل', 'Activation space'), tx('مميزة', 'Premium')], [tx('تكامل مع المسرح', 'Stage integration'), '✓'], [tx('تضخيم رقمي', 'Digital amplification'), '360°'], [tx('ضيافة', 'Hospitality'), tx('راقية', 'Elevated')]] },
  gold: { n: tx('شريك ذهبي', 'Gold Partner'), s: tx('حضور يلفت النظر', 'Presence that turns heads'), f: tx('ظهور مميز وتواجد محسّن بيوصل علامتك لجمهور متفاعل وبيبني علاقات حقيقية.', 'Premium visibility and enhanced presence that connect your brand with an engaged audience and build meaningful relationships.'), price: 120000,
    b: [[tx('ظهور العلامة', 'Brand visibility'), 'Tier-1'], [tx('مساحة تفعيل', 'Activation space'), tx('متاحة*', 'Available*')], [tx('تكامل مع المسرح', 'Stage integration'), '—'], [tx('تضخيم رقمي', 'Digital amplification'), tx('محسّن', 'Enhanced')], [tx('ضيافة', 'Hospitality'), tx('قياسية', 'Standard')]] },
  silver: { n: tx('شريك فضي', 'Silver Partner'), s: tx('بداية ذكية', 'A smart first step'), f: tx('نقطة دخول مثالية للعلامات اللي عايزة تكون جزء من الحكاية.', 'The ideal entry point for brands that want to be part of the story.'), price: 60000,
    b: [[tx('ظهور العلامة', 'Brand visibility'), 'Tier-2'], [tx('مساحة تفعيل', 'Activation space'), tx('متاحة*', 'Available*')], [tx('تكامل مع المسرح', 'Stage integration'), '—'], [tx('تضخيم رقمي', 'Digital amplification'), tx('أساسي', 'Core')], [tx('ضيافة', 'Hospitality'), tx('قياسية', 'Standard')]] },
};
$('#foot').innerHTML = `SAHRA EVENTS · ${tx('قمة صنّاع المحتوى 2026', 'Cairo Creators Summit 2026')}<br>${tx('عن الشركة · الصحافة · تواصل معنا', 'About · Press · Contact')}<br><span class="sim">${tx('محاكاة تعليمية — الباقات والأسعار من خيالنا', 'Classroom simulation — packages and prices are fictional')}</span>`;
let gated = false, chats = 0;

function home() {
  $('#app').innerHTML = `<div class="hero"><h1>${tx('كن جزءًا من ', 'Be part of ')}<span class="gold">${tx('حاجة استثنائية', 'something extraordinary')}</span></h1><p>${tx('قمة صنّاع المحتوى 2026: فرصة فريدة لعلامتك إنها تتواصل وتلهم وتكبر.', 'Cairo Creators Summit 2026: a unique opportunity for your brand to connect, inspire and grow.')}</p><a class="btn" href="#/deck" data-t="hero-deck">${tx('حمّل ملف الرعاية', 'Download the deck')}</a></div>
    <div class="wrap"><div class="stats"><div><b>10K+</b>${tx('وصول*', 'reach*')}</div><div><b>∞</b>${tx('احتمالات', 'possibilities')}</div><div><b>100%</b>${tx('شغف', 'passion')}</div></div>
    <div class="h">${tx('ليه تبقى شريك؟', 'Why partner with us?')}</div>
    <div class="why"><b>${tx('ظهور لا مثيل له', 'Unparalleled exposure')}</b>${tx('علامتك قدام آلاف الحضور المتفاعلين وجمهور رقمي ضخم.', 'Your brand in front of thousands of engaged attendees and a massive digital audience.')}</div>
    <div class="why"><b>${tx('جمهور مميز', 'A premium audience')}</b>${tx('صنّاع قرار ومؤثرين وقادة رأي من كل المجالات.', 'Decision makers, influencers and thought leaders from every field.')}</div>
    <div class="why"><b>${tx('تجارب بتعيش', 'Experiences that last')}</b>${tx('بنخلق لحظات بتربط علامتك بالناس بشكل حقيقي.', 'We craft moments that authentically connect your brand with people.')}</div>
    <div class="h">${tx('مستويات الشراكة', 'Partnership tiers')}</div>
    ${Object.entries(P).map(([k, p]) => `<div class="pk"><h3>${p.n}</h3><i>${p.s}</i><p>${p.f}</p><a class="btn" href="#/p/${k}/overview" data-t="package">${tx('اكتشف', 'Discover')}</a></div>`).join('')}
    <div class="note" style="text-align:center">${tx('* أرقام تقديرية.', '* Estimated figures.')}</div></div>`;
  scrollTo(0, 0); Lab.setView({ view: 'home', kind: 'home' }); chat(7000);
}
function pack(k, tab) {
  const p = P[k]; if (!p) return home();
  if (tab === 'invest' && !gated) return gate(() => pack(k, 'invest'));
  const T = [['overview', tx('نظرة عامة', 'Overview')], ['benefits', tx('المزايا', 'Benefits')], ['invest', tx('الاستثمار', 'Investment')]];
  const body = { overview: `<p style="margin:0">${p.f}</p><p style="color:#b9b0d8">${tx('من أول لحظة، فريقنا هيشتغل معاك عشان نصمم شراكة على مقاسك بتحقق أهدافك وتعدّي توقعاتك.', 'From day one, our team works hand in hand with you to craft a tailored partnership that meets your objectives and exceeds expectations.')}</p><a class="btn f" href="#/p/${k}/invest" data-t="talk">${tx('يلا نتكلم', 'Let’s talk')}</a>`,
    benefits: `<table>${p.b.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><div class="note">${tx('* حسب الشروط. التعريفات في ملف الرعاية.', '* Subject to terms. See the sponsorship deck for definitions.')}</div><a class="btn" href="#/deck" data-t="deck-link" style="margin-top:12px">${tx('ملف الرعاية (PDF)', 'Sponsorship deck (PDF)')}</a>`,
    invest: `<table><tr><td>${tx('استثمار الباقة', 'Package investment')}</td><td>${N(p.price)} ${EGP}</td></tr></table><div class="note" style="font-size:11px;margin-top:14px">${tx('إضافات اختيارية: مساحة تفعيل 3×3 م: 30,000 · دعوات ضيافة إضافية (2): 8,000 · الأسعار شاملة الضريبة.', 'Optional enhancements: activation space 3×3 m: 30,000 · extra hospitality passes (2): 8,000 · prices include VAT.')}</div>` }[tab] || '';
  $('#app').innerHTML = `<div class="hero" style="padding:30px 22px 24px"><h1 style="font-size:28px;margin:0">${p.n}</h1><p style="margin:6px 0 0" class="gold">${p.s}</p></div>
    <div class="tabs">${T.map(([t, l]) => `<a class="${t === tab ? 'on' : ''}" href="#/p/${k}/${t}" data-t="tab-${t}">${l}</a>`).join('')}</div><div class="wrap" style="padding-top:0"><div class="pane">${body}</div>
    <a class="btn" href="#/" data-t="back" style="margin-top:16px">‹ ${tx('كل المستويات', 'All tiers')}</a></div>`;
  scrollTo(0, 0); Lab.setView({ view: 'pack-' + tab, kind: 'package', id: k + ':' + tab }); chat(9000);
}
function gate(after) {
  const t0 = Date.now(); const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="mod"><h3>${tx('خلّينا نصمم شراكتك', 'Let’s tailor your partnership')}</h3><p>${tx('سيب بياناتك وفريق الشراكات هيكلمك في خلال 3 أيام عمل.', 'Leave your details and our partnerships team will get back to you within 3 working days.')}</p>
    <input placeholder="${tx('الاسم', 'Name')}" data-t="gate-input"><input placeholder="${tx('الشركة', 'Company')}" data-t="gate-input"><input placeholder="${tx('الموبايل', 'Mobile')}" data-t="gate-input">
    <button class="btn f" data-t="gate-send" id="gs">${tx('ابعت', 'Send')}</button><button class="tl" data-t="gate-skip" id="gk">${tx('عرض الأسعار القياسية', 'view standard rate card')}</button></div>`;
  document.body.appendChild(o);
  const close = (action) => { gated = true; Lab.log('gate', { action, ms: Date.now() - t0 }); o.remove(); after(); };
  o.querySelector('#gs').onclick = () => { Lab.toast(tx('شكرًا! هنكلمك قريب', 'Thank you! We’ll be in touch')); close('send'); };
  o.querySelector('#gk').onclick = () => close('skip');
}
let deckT = null;
function deck() {
  clearTimeout(chatT);
  const m = (a, b, c) => `<td>${a}</td><td>${b}</td><td>${c}</td>`;
  const pages = [
    `<div class="pg cv" data-t="pdf-page"><h4>PARTNERSHIP<br>OPPORTUNITIES</h4><div>Cairo Creators Summit 2026 · Sahra Events</div></div>`,
    `<div class="pg" data-t="pdf-page"><h4>Our story</h4>We believe in the power of creators to shape culture. Since day one our mission has been to build a platform where ideas meet opportunity and where brands become part of a movement. Every edition is bigger, bolder and more impactful than the last. Our community is passionate, loyal and highly engaged across every touchpoint, online and on the ground.</div>`,
    `<div class="pg" data-t="pdf-page"><h4>Our audience</h4>Thousands of attendees. Millions of impressions. A premium demographic of creators, marketers, founders and decision makers with strong purchasing power and high brand affinity. Our digital ecosystem delivers always-on amplification before, during and after the event, driving awareness, consideration and love.</div>`,
    `<div class="pg" data-t="pdf-page"><h4>Benefits matrix</h4><table><tr><th>Benefit</th><th>Platinum</th><th>Gold</th><th>Silver</th></tr><tr><td>Tier-1 brand visibility</td>${m('●', '●', '○')}</tr><tr><td>Tier-2 brand visibility</td>${m('●', '●', '●')}</tr><tr><td>Activation space</td>${m('●', '+', '+')}</tr><tr><td>Stage integration</td>${m('●', '○', '○')}</tr><tr><td>Digital amplification</td>${m('360°', 'Enhanced', 'Core')}</tr><tr><td>Hospitality passes</td>${m('8', '4', '2')}</tr></table></div>`,
    `<div class="pg" data-t="pdf-page"><h4>Definitions</h4><b>●</b> included &nbsp; <b>○</b> not included &nbsp; <b>+</b> available as a paid add-on.<br><b>Tier-1 brand visibility:</b> logo on the main-stage backdrop and screens.<br><b>Tier-2 brand visibility:</b> logo in the printed programme and on the event website.<br><b>Activation space:</b> a 3×3 m booth on the expo floor.<br><b>Stage integration:</b> a 10-minute speaking slot on the main stage.<br><b>Digital amplification:</b> Core = 1 post, Enhanced = 3 posts, 360° = 6 posts and a dedicated reel.</div>`,
    `<div class="pg cv" data-t="pdf-page"><h4>Let’s create magic together</h4><div>partnerships@sahra.events</div></div>`];
  $('#app').innerHTML = `<div class="load"><div class="spin"></div>${tx('جاري تحميل الملف…', 'Loading PDF…')}<br><small>CCS26_Partnership_Deck_FINAL_v7.pdf · 14 MB</small></div>`;
  scrollTo(0, 0); Lab.setView({ view: 'deck-loading', kind: 'deck' });
  clearTimeout(deckT); deckT = setTimeout(() => { if (location.hash !== '#/deck') return;
    $('#app').innerHTML = `<div class="pdfbar"><a href="#/" data-t="pdf-back">‹ ${tx('رجوع', 'Back')}</a><span>CCS26_Partnership_Deck_FINAL_v7.pdf · 1/6</span></div><div class="pdf">${pages.join('')}</div>`;
    document.querySelectorAll('.pg').forEach((g, i) => g.onclick = () => { const z = g.classList.toggle('z'); if (z) Lab.log('zoom', { page: i + 1 }); });
    Lab.setView({ view: 'deck', kind: 'deck' }); }, Lab.dashboard ? 0 : 2600);
}
let chatT = null;
function chat(delay) {
  clearTimeout(chatT); if (Lab.dashboard || chats >= 2) return;
  chatT = setTimeout(() => { if (document.querySelector('.chat,.ov')) return; chats++; const t0 = Date.now(); const c = document.createElement('div'); c.className = 'chat';
    c.innerHTML = `<span class="x" data-t="chat-close">✕</span><b>💬 ${tx('نور من فريق الشراكات', 'Nour from Partnerships')}</b><div class="b">${tx('أهلًا! 👋 مهتم تبقى شريك؟ سيب رقمك وهنكلمك.', 'Hi there! 👋 Interested in partnering? Leave your number and we’ll call you.')}</div><div class="in" data-t="chat-input">${tx('اكتب رسالتك…', 'Type your message…')}</div>`;
    document.body.appendChild(c); Lab.log('adseen', { id: 'sponsor-chat' });
    c.querySelector('.x').onclick = () => { Lab.log('chat', { action: 'close', ms: Date.now() - t0 }); c.remove(); };
    c.querySelector('.in').onclick = () => Lab.toast(tx('كل الفريق مشغول دلوقتي', 'All our team members are busy right now')); }, delay);
}
function route() { const h = location.hash, m = h.match(/^#\/p\/(\w+)\/(\w+)/); if (m) pack(m[1], m[2]); else if (h === '#/deck') deck(); else home(); }
addEventListener('hashchange', route); route();
})();
</script>
</body></html>
